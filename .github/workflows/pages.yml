name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # Actions fijadas por SHA (con la versión en el comentario): una etiqueta se puede mover,
      # un SHA no. Para actualizar: git ls-remote --tags https://github.com/actions/<action>.git
      # Versiones que se ejecutan con Node 24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El workflow no hace git push: el token no debe quedarse en .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Sin dependencias: no hay nada que cachear.
          package-manager-cache: false

      - name: Generar src/js/config.local.js desde los Secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EMAILS_AUTORIZADOS: ${{ secrets.EMAILS_AUTORIZADOS }}
        run: node scripts/generar-config-local.mjs

      - name: Versionar la caché del Service Worker con el commit
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/^const CACHE_VERSION = '.*';/const CACHE_VERSION = '${VERSION}';/" src/sw.js
          grep -q "CACHE_VERSION = '${VERSION}'" src/sw.js

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src

      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
