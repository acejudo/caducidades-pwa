name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # Versiones que se ejecutan con Node 24 (GitHub retira Node 20). Fijarlas por SHA va
      # en endurecimiento-seguridad.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Sin dependencias: no hay nada que cachear.
          package-manager-cache: false

      - name: Generar src/js/config.local.js desde los Secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EMAILS_AUTORIZADOS: ${{ secrets.EMAILS_AUTORIZADOS }}
        run: node scripts/generar-config-local.mjs

      - name: Versionar la caché del Service Worker con el commit
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/^const CACHE_VERSION = '.*';/const CACHE_VERSION = '${VERSION}';/" src/sw.js
          grep -q "CACHE_VERSION = '${VERSION}'" src/sw.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: src

      - id: despliegue
        uses: actions/deploy-pages@v5
