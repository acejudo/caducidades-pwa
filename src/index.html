<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Solo scripts de la app y de Google Sign-In, y conexiones a las APIs de Google
       (pwa-shell, "Política de seguridad de contenido"). Para una API nueva, añadir su
       origen exacto a la directiva concreta; nunca * ni 'unsafe-inline'. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' blob:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
  <title>Caducidades</title>
  <meta name="description" content="Control de fechas de caducidad de los alimentos">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Caducidades">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="cabecera" id="cabecera"></header>
    <main class="contenido" id="contenido"></main>
    <nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal" hidden></nav>
  </div>
</body>
</html>
